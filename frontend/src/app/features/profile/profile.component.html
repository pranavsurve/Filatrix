<div class="profile-container container max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-slate-100 mb-8">My Profile</h1>

  <mat-card class="profile-card glass-card !p-6 !mb-6">
    <div class="profile-header flex items-center gap-5">
      <div class="avatar w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center flex-shrink-0 shadow-lg shadow-indigo-500/20">
        @if (user()?.avatar) {
          <img [src]="user()!.avatar" [alt]="user()!.name" class="w-full h-full rounded-full object-cover">
        } @else {
          <mat-icon class="!text-3xl !text-white">account_circle</mat-icon>
        }
      </div>
      <div class="info">
        <h2 class="!text-xl !font-bold !text-slate-100 !mb-1">{{ user()?.name }}</h2>
        <p class="!text-slate-400 !mb-2">{{ user()?.email }}</p>
        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold !bg-indigo-500/10 !text-indigo-300 border border-indigo-500/20 capitalize">{{ user()?.role | titlecase }}</span>
      </div>
    </div>
  </mat-card>

  <mat-card class="edit-form glass-card !p-6">
    <h3 class="!text-lg !font-bold !text-slate-100 !mb-5">Edit Profile</h3>
    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <mat-form-field appearance="outline" class="!w-full">
        <mat-label class="text-slate-400">Name</mat-label>
        <input matInput [(ngModel)]="name" name="name" required class="text-slate-200">
      </mat-form-field>

      <mat-form-field appearance="outline" class="!w-full">
        <mat-label class="text-slate-400">Avatar URL</mat-label>
        <input matInput [(ngModel)]="avatar" name="avatar" class="text-slate-200">
      </mat-form-field>

      @if (success()) {
        <p class="success-message !text-green-400 !text-sm !p-3 !rounded-lg !bg-green-500/10 !border !border-green-500/20">Profile updated successfully!</p>
      }

      <button mat-raised-button type="submit" class="!rounded-xl !bg-gradient-to-r !from-indigo-600 !to-purple-600 !text-white !border-0 !font-semibold hover:!from-indigo-500 hover:!to-purple-500 !shadow-lg !shadow-indigo-500/20 !self-start !px-8">
        Save Changes
      </button>
    </form>
  </mat-card>
</div>
