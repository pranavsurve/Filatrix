<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
      <mat-card-subtitle>Join Filatrix - 3D Print Marketplace</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="name" name="name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required minlength="6">
          <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>I want to</mat-label>
          <mat-select [(ngModel)]="role" name="role">
            <mat-option value="buyer">Buy 3D printed items</mat-option>
            <mat-option value="seller">Sell 3D printed items</mat-option>
          </mat-select>
        </mat-form-field>

        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button mat-raised-button color="primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
